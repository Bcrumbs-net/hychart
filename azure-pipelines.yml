# Pull requests only: merges are built and deployed by GitHub Actions
# (.github/workflows/ci.yml). Same split as core and bot.
# This pipeline validates PRs: install, Next.js build, and a Docker build (not pushed).
trigger: none

pr:
  branches:
    include:
      - master
      - develop
      - main

jobs:
  - job: ci
    displayName: Build
    timeoutInMinutes: 30
    pool:
      vmImage: ubuntu-latest
    steps:
      - task: NodeTool@0
        displayName: Use Node 20
        inputs:
          versionSpec: '20.x'

      - script: npm ci --legacy-peer-deps
        displayName: Install dependencies

      - script: npm run build
        displayName: Build (next build)
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - task: Docker@2
        displayName: Build Docker image (not pushed)
        inputs:
          command: build
          repository: hychart
          Dockerfile: ./Dockerfile
          buildContext: .
